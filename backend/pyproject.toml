[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "awaazsetu-api"
version = "0.1.0"
description = "Mock-mode FastAPI backend for the AwaazSetu prototype"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "google-genai==2.33.0",
    "httpx==0.28.1",
    "uvicorn[standard]==0.54.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
